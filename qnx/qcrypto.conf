# QNX Cryptography Library (qcrypto) configuration.
#
# The `random` service uses qcrypto, and qcrypto refuses to
# initialise without this file ("failed to load configuration
# file '/etc/qcrypto.conf'"), which makes `random` exit with
# "Random init failed" and leaves the system without /dev/random
# (so io-sock exits and there is no network/SSH).
#
# Format (QNX 8.0 docs): "<plugin> tags=<tag>[,<tag>...]".
# QNX 8.0's OpenSSL plugin is openssl-3 (not openssl); tags=*
# routes every request to it. The plugin DLL itself is
# qcrypto-openssl-3.so (listed in the buildfile's libraries).
openssl-3 tags=*
